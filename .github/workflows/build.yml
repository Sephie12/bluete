name: APK bauen

on:
  push:
    branches: [ main ]
    paths-ignore: [ 'server/**', '.github/workflows/server.yml', '**.md' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests und APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: bluete-apk
          path: app/build/outputs/apk/release/app-release.apk
      - name: Als Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Bluete.apk
          gh release create "build-${{ github.run_number }}" Bluete.apk \
            --title "Blüte Build ${{ github.run_number }}" \
            --notes "APK auf dem Tablet herunterladen und antippen, um zu installieren oder zu aktualisieren." \
            --latest
